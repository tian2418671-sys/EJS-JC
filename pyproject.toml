[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mvu-lint"
version = "1.0.0"
description = "MVU + EJS 智能代码检查工具"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
gui = ["PySide6>=6.6"]
ai = ["llama-cpp-python>=0.2"]

[project.scripts]
mvu-lint = "mvu_lint.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
